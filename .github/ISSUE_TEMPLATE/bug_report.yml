name: 🐛 Bug 报告
description: 报告一个可复现的缺陷
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报 Bug！请尽量填全下方信息，越具体我们修得越快。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 实际发生了什么？期望是什么？
      placeholder: 简明的现象 + 期望行为
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      options:
        - 钉钉 (DingTalk)
        - 飞书 (Feishu/Lark)
        - 企业微信 (WeCom)
        - Web 管理台
        - 多平台 / 不确定
        - 其他 / 非平台相关
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小可复现步骤最佳
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 版本 / 系统 / 运行方式（docker 或 venv）
      placeholder: |
        - Linkora 版本 / commit：
        - 系统：macOS / Linux / Windows / Docker：
        - Python 版本：
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 报错
      description: 贴关键日志或报错栈（**请勿包含任何密钥、token、个人信息**）
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前自检
      options:
        - label: 已确认日志中不含密钥 / 个人隐私信息
          required: true
        - label: 已搜索历史 Issue，确认非重复提交
          required: true
