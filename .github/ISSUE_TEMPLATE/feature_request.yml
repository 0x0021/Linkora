name: 💡 功能建议
description: 提出新功能或改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个建议是为了解决什么痛点 / 场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你期望如何工作？如有具体设计更好。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考
      description: 考虑过哪些替代方案？有无参考实现？
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围（大致）
      options:
        - 单平台适配（钉钉 / 飞书 / 企微）
        - 跨平台核心
        - Web 管理台
        - 工具 / 意图
        - 文档 / 配置
        - 不确定
    validations:
      required: false
