name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Dependency consistency gate
        # 断言 requirements.txt / pyproject.toml / requirements.lock / uv.lock
        # 四处依赖声明版本一致。纯标准库、不联网、毫秒级，放在装依赖之前快速失败。
        # 历史事故：requirements.txt 钉 fastapi==0.140.0 而 lock 停在 0.139.0，
        # uv.lock 里根本没有 fastapi/openai 条目 —— CI 测的和实际发布的不是同一套版本。
        run: python scripts/check_deps.py

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          # 钉版：ruff 版本直接影响 lint 结论，浮动会导致「昨天绿、今天红」。
          # 需与 pyproject.toml 的 dev extra 保持一致。
          pip install ruff==0.16.0

      - name: Run ruff linter
        run: ruff check src tests web scripts --output-format=github
        continue-on-error: true

      - name: Static check gate (C901 complexity + PGH004 f-string safety)
        # 硬门禁：只针对「新代码零容忍」的两条规则，避免被 1127 条存量风格告警淹没。
        #  - C901：圈复杂度（阈值 60，runtime/poller_strategy/config 三个上帝类临时豁免，
        #    随 F1/F7 拆分推进逐步移除豁免收紧）。基线 0 违规。
        #  - PGH004：此前导致 uvicorn 启动失败的 f-string 嵌套引号语法错误。基线 0 违规。
        # 任一文件新增违规即阻断合并；其余风格类 ruff 规则仍保持 report-only。
        run: ruff check src tests web scripts --select C901,PGH004 --output-format=github

      - name: Syntax gate (P0)
        # 杜绝 f-string 嵌套引号等导致 uvicorn 启动失败的 SyntaxError。
        # AST 解析零依赖、毫秒级；与 .gitlab-ci.yml lint stage 等价。
        run: |
          python - <<'PY'
          import ast, glob, sys
          bad = []
          for pat in ('src/**/*.py', 'web/**/*.py', 'main.py', 'scripts/**/*.py'):
              for f in glob.glob(pat, recursive=True) or []:
                  try:
                      ast.parse(open(f, encoding='utf-8').read())
                  except SyntaxError as e:
                      bad.append(f"{f}:{e.lineno}: {e.msg}")
          if bad:
              print("SyntaxError in:")
              print("\n".join(bad))
              sys.exit(1)
          print("OK: all Python modules parse")
          PY

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 项目统一仅支持 Python 3.14 系列（CI / 工作流 / Docker 均已切换到 3.14.6），
        # 不再检查或匹配 3.12 / 3.13 等其他版本。
        # 与 pyproject.toml 的 requires-python = ">=3.14" 由 scripts/check_deps.py 联动校验。
        python-version: ["3.14.6"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Provide test config
        # config.yaml is gitignored (contains secrets). Tests that call
        # load_config need a config file to exist; the committed example is a
        # complete, valid template with placeholder keys. dws/LLM are mocked in
        # tests, so no real credentials are required.
        run: cp config.yaml.example config.yaml

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Dependency vulnerability scan (pip-audit)
        # 供应链安全：扫描 requirements.lock 中已知漏洞（基于锁定版本，复现一致）。
        # 报告型，不阻断 CI（避免上游传递依赖的误报挂死构建），但会暴露问题供后续处理。
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install pyright
        run: python -m pip install pyright==1.1.411

      - name: Type check (non-regression gate, F9)
        # 渐进类型门禁（F9）第一步：锁定基线，只允许减少、不允许增加。
        # 基线由 scripts/type_baseline.py 的 TYPE_ERROR_BASELINE 控制（当前 1057 条，
        # 2026-08-05 在 main / Python 3.14.6 实测 src+web 的 pyright error 数）。
        # 每收敛一批类型错误后，重跑 `pyright --outputjson` 并将该常量随之下调，门禁随之收紧。
        # 配置见 pyproject.toml [tool.pyright]（include=src,web / typeCheckingMode=basic）。
        run: |
          pyright --outputjson > pyright-report.json
          python scripts/type_baseline.py pyright-report.json

      - name: Upload pyright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyright-report
          path: pyright-report.json
