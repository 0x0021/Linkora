name: Linkora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # faiss / numpy 各自打包 OpenMP 运行时，重复初始化会触发
      # "OMP: Error #15: Initializing libomp twice" → SIGABRT。
      # pytest 必须带此变量（本地同理，见项目约定）。
      KMP_DUPLICATE_LIB_OK: "TRUE"
      # 固定账号身份键，令会话库物理路径在任何环境下稳定。
      # account_identity 会探测外部 dws/lark-cli 取真实 corpId → 库名 hash 随环境
      # 漂移，本机无 dws 与 CI 装 dws 得到不同库文件，表现为「本地全绿、CI 红」
      # 且失败点与身份探测毫无关系（血泪：display_summary_scheduler 两条用例）。
      # 生产环境切勿设置——会破坏真实账号隔离。
      LINKORA_FORCE_ACCOUNT_ID: "ci-test"
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Sync dependencies (runtime + dev)
      run: uv sync --extra dev

    - name: Provide config.yaml for tests
      # config.yaml 含密钥被 gitignore，CI 仓库内不存在；大量测试与 web 鉴权中间件
      # 依赖其存在（否则 FileNotFoundError / JWT 401）。example 已提交且无密钥，
      # 按官方文档 cp 出一份即可（jwt_secret 留空 → 进程内随机密钥缓存，测试内同源可用）。
      # 注意：example 的 auth_password 为占位符 REPLACE_WITH_YOUR_STRONG_PASSWORD，
      # 会被 WebConfig 的 fail-closed 安全校验拒绝（生产预期行为：防止照搬模板裸奔）。
      # CI 注入一次性随机强密码，使 auth_enabled=true 的测试配置合法通过校验，
      # 同时保留安全门在 CI 中对真实 auth 路径的覆盖；该密钥仅存于 runner 临时文件，不入库。
      run: |
        cp config.yaml.example config.yaml
        python - <<'PY'
        import re, secrets
        p = "config.yaml"
        s = open(p, encoding="utf-8").read()
        pw = secrets.token_urlsafe(24)
        s = re.sub(
            r"(auth_password:\s*')[^']*(')",
            lambda m: m.group(1) + pw + m.group(2),
            s, count=1,
        )
        open(p, "w", encoding="utf-8").write(s)
        print("CI: injected randomized test auth_password (placeholder replaced)")
        PY

    - name: Run tests
      run: |
        uv run pytest tests/ \
          --ignore=tests/test_account_isolation_integration.py \
          --ignore=tests/test_account_identity.py \
          -q --tb=short

    - name: Run Ruff
      run: uv run ruff check src/

    - name: Verify dependency consistency
      # 四源一致（requirements.txt / requirements.lock / uv.lock / pyproject）
      # 此前 check_deps.py 只在注释与 DEV_GUIDE 里承诺「CI 会跑」，实际从未接线。
      run: uv run python scripts/check_deps.py --strict

    - name: Verify frontend manifest
      # 前端有三份手工同步的清单（build_frontend.mjs JS_ORDER/CSS_ORDER、
      # index.html 开发态 script 标签）。新增文件漏登记时生产 bundle 正常、
      # 开发态直接 ReferenceError 白屏，且线上无任何报错——此门禁使其在 CI 暴露。
      run: uv run python scripts/check_frontend_manifest.py

    - name: Run Pyright
      # 不要传路径参数：pyproject 的 [tool.pyright] include = ["src", "web"] 才是门禁范围，
      # 传路径会覆盖 include。早期写成 `pyright src/` 导致 web/ 从未被类型门禁覆盖，
      # 由此漏掉 web/routers/image.py「在 str 上调 Path 方法」的真实崩溃 bug（2026-08-28）。
      run: uv run pyright

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm

    # npm ci 走 package-lock.json，esbuild 版本被锁定 → 构建产物可复现，
    # 下面的「产物漂移」检查才可靠。
    - name: Install dependencies
      run: npm ci

    - name: Build bundle
      run: npm run build:frontend

    - name: Check bundle is up to date
      # web/static/dist 强制进仓且由构建生成：源码改了却没重建（或重建结果未提交）
      # 会让线上跑的与仓库不一致。构建产物现在是确定性的（sourcemap 的 sources
      # 已规范化为固定名，不再嵌随机临时路径），因此这里可以严格断言零漂移。
      run: |
        if [ -n "$(git status --porcelain -- web/static/dist)" ]; then
          echo "::error::web/static/dist 与源码不同步，请在本地运行 npm run build:frontend 并提交产物"
          git status --porcelain -- web/static/dist
          git diff -- web/static/dist | head -40
          exit 1
        fi

    # 三层护栏，缺一不可：
    #   smoke:bundle  — 产物里有该有的符号（静态）
    #   smoke:runtime — jsdom 真跑一遍 HTML+bundle，抓加载期崩溃（命名空间残缺 / TDZ）
    #   test:frontend — 真实 DOM 渲染断言
    - name: Frontend smoke (bundle symbols)
      run: npm run smoke:bundle

    - name: Frontend smoke (runtime boot)
      run: npm run smoke:runtime

    - name: Frontend tests
      run: npm run test:frontend

  # 分支保护的 required status check 就是「CI 汇总」，此前没有对应 job →
  # 该 check 永远 pending，每次合入都只能 bypass。此 job 汇聚 test/frontend
  # 结果给出真实结论：任一失败/被取消则汇总红，全部通过则绿。
  summary:
    name: CI 汇总
    needs: [test, frontend]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 汇总判定
        run: |
          echo "test=${{ needs.test.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          if [[ "${{ needs.test.result }}" != "success" \
             || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "::error::存在未通过的 job，CI 汇总失败"
            exit 1
          fi
          echo "全部 job 通过，CI 汇总绿"
