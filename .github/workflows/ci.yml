name: Linkora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # faiss / numpy 各自打包 OpenMP 运行时，重复初始化会触发
      # "OMP: Error #15: Initializing libomp twice" → SIGABRT。
      # pytest 必须带此变量（本地同理，见项目约定）。
      KMP_DUPLICATE_LIB_OK: "TRUE"
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Sync dependencies (runtime + dev)
      run: uv sync --extra dev

    - name: Run tests
      run: |
        uv run pytest tests/ \
          --ignore=tests/test_account_isolation_integration.py \
          --ignore=tests/test_account_identity.py \
          -q --tb=short

    - name: Run Ruff
      run: uv run ruff check src/

    - name: Run Pyright
      run: uv run pyright src/
