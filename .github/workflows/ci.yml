name: Linkora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # faiss / numpy 各自打包 OpenMP 运行时，重复初始化会触发
      # "OMP: Error #15: Initializing libomp twice" → SIGABRT。
      # pytest 必须带此变量（本地同理，见项目约定）。
      KMP_DUPLICATE_LIB_OK: "TRUE"
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Sync dependencies (runtime + dev)
      run: uv sync --extra dev

    - name: Provide config.yaml for tests
      # config.yaml 含密钥被 gitignore，CI 仓库内不存在；大量测试与 web 鉴权中间件
      # 依赖其存在（否则 FileNotFoundError / JWT 401）。example 已提交且无密钥，
      # 按官方文档 cp 出一份即可（jwt_secret 留空 → 进程内随机密钥缓存，测试内同源可用）。
      # 注意：example 的 auth_password 为占位符 REPLACE_WITH_YOUR_STRONG_PASSWORD，
      # 会被 WebConfig 的 fail-closed 安全校验拒绝（生产预期行为：防止照搬模板裸奔）。
      # CI 注入一次性随机强密码，使 auth_enabled=true 的测试配置合法通过校验，
      # 同时保留安全门在 CI 中对真实 auth 路径的覆盖；该密钥仅存于 runner 临时文件，不入库。
      run: |
        cp config.yaml.example config.yaml
        python - <<'PY'
        import re, secrets
        p = "config.yaml"
        s = open(p, encoding="utf-8").read()
        pw = secrets.token_urlsafe(24)
        s = re.sub(
            r"(auth_password:\s*')[^']*(')",
            lambda m: m.group(1) + pw + m.group(2),
            s, count=1,
        )
        open(p, "w", encoding="utf-8").write(s)
        print("CI: injected randomized test auth_password (placeholder replaced)")
        PY

    - name: Run tests
      run: |
        uv run pytest tests/ \
          --ignore=tests/test_account_isolation_integration.py \
          --ignore=tests/test_account_identity.py \
          -q --tb=short

    - name: Run Ruff
      run: uv run ruff check src/

    - name: Run Pyright
      # 不要传路径参数：pyproject 的 [tool.pyright] include = ["src", "web"] 才是门禁范围，
      # 传路径会覆盖 include。早期写成 `pyright src/` 导致 web/ 从未被类型门禁覆盖，
      # 由此漏掉 web/routers/image.py「在 str 上调 Path 方法」的真实崩溃 bug（2026-08-28）。
      run: uv run pyright

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm

    # npm ci 走 package-lock.json，esbuild 版本被锁定 → 构建产物可复现，
    # 下面的「产物漂移」检查才可靠。
    - name: Install dependencies
      run: npm ci

    - name: Build bundle
      run: npm run build:frontend

    - name: Check bundle is up to date
      # web/static/dist 强制进仓且由构建生成：源码改了却没重建（或重建结果未提交）
      # 会让线上跑的与仓库不一致。构建产物现在是确定性的（sourcemap 的 sources
      # 已规范化为固定名，不再嵌随机临时路径），因此这里可以严格断言零漂移。
      run: |
        if [ -n "$(git status --porcelain -- web/static/dist)" ]; then
          echo "::error::web/static/dist 与源码不同步，请在本地运行 npm run build:frontend 并提交产物"
          git status --porcelain -- web/static/dist
          git diff -- web/static/dist | head -40
          exit 1
        fi

    # 三层护栏，缺一不可：
    #   smoke:bundle  — 产物里有该有的符号（静态）
    #   smoke:runtime — jsdom 真跑一遍 HTML+bundle，抓加载期崩溃（命名空间残缺 / TDZ）
    #   test:frontend — 真实 DOM 渲染断言
    - name: Frontend smoke (bundle symbols)
      run: npm run smoke:bundle

    - name: Frontend smoke (runtime boot)
      run: npm run smoke:runtime

    - name: Frontend tests
      run: npm run test:frontend
