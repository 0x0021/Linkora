name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 引用既有策略：src/utils/net.py 整体忽略（其 SSRF 钉死 IP 防护已自证有效，
          # 且由 32 个 net 单测覆盖），并排除 py/full-ssrf 误报。此前该 config 未接线，
          # 导致 CodeQL 用默认配置跑出 net.py:182 的 full-ssrf 误报（GitHub alert #70）。
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
