name: Dependabot 自动合并

# 对 Dependabot 的 minor / patch 升级 PR 自动合并；major 升级保留人工评审，
# 避免破坏性变更被无脑合入。
#
# 与 dependabot-sync-lockfiles.yml 的分工
# ------------------------------------------
# · dependabot-sync-lockfiles.yml：先在 PR 分支上重生成锁文件并推回分支
#   （GITHUB_TOKEN 推送不触发 CI，故它会显式 dispatch 一次 ci.yml）。
# · 本 workflow：等「CI 汇总」这个 required check 变绿后再 squash 合并。
#   等的是 required check 本身，而不是某个 job —— 分支保护只认「CI 汇总」。
#
# 为什么不再执行 `gh pr review --approve`
# ----------------------------------------
# 仓库未开启 "Allow GitHub Actions to create and approve pull requests"
# （can_approve_pull_request_reviews = false），审批请求会被 GitHub 拒绝：
#   GraphQL: GitHub Actions is not permitted to approve pull requests.
# 而分支保护本身 required_approving_review_count = 0（即并不要求人工审批），
# 所以这一步不仅多余，还是 auto-merge 失败的唯一原因（2026-10-21 实测）。
# 直接走 `gh pr merge --squash` 即可，required check 通过后即可合入。

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: 获取 Dependabot 元数据
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: 审批并合并（仅 minor/patch）
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 轮询等待分支保护要求的必填 status check「CI 汇总」通过。
          # 注意：
          # · 必须等 required check 本身（CI 汇总 = test + frontend 汇总），
          #   等单个 job 会漏判 —— 审计 P1-18 记录过这个脱节。
          # · 依赖同步 workflow 推完锁文件后会 dispatch 新一轮 CI，
          #   这期间可能短暂出现上一轮的失败状态，故失败不立即退出，
          #   而是继续轮询直到超时；只有当「CI 汇总」成功才合并。
          for i in $(seq 1 60); do
            state=$(gh pr checks "$PR_URL" --json name,state \
              --jq '[.[] | select(.name=="CI 汇总") | .state] | unique | join(",")' \
              2>/dev/null || echo "UNKNOWN")
            echo "第 $i 次尝试：CI 汇总 状态 = $state"
            if [ "$state" = "SUCCESS" ]; then
              echo ">> CI 汇总通过，开始合并"
              gh pr merge --squash "$PR_URL"
              exit 0
            fi
            sleep 30
          done
          echo ">> 等待「CI 汇总」超时，不合并"
          exit 1
