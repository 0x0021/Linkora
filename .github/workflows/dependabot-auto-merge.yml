name: Dependabot 自动合并

# 对 Dependabot 的 minor / patch 升级 PR 自动合并；major 升级保留人工评审，
# 避免破坏性变更被无脑合入。
#
# 与 dependabot-sync-lockfiles.yml 的分工
# ------------------------------------------
# · dependabot-sync-lockfiles.yml（pull_request 触发）：在 PR 分支上重生成
#   requirements.lock / uv.lock 并推回分支，再 dispatch 一次 ci.yml。
# · 本 workflow（pull_request_target 触发）：确认锁文件已同步、等「CI 汇总」
#   变绿后 squash 合并。
#
# 为什么合并方用 pull_request_target
# ----------------------------------
# GitHub 的规则（官方文档「Triggering a workflow」）：当 workflow 用 GITHUB_TOKEN
# 创建或更新 PR 时，产生的 pull_request 事件会创建「处于待审批状态」的 workflow
# run —— 需人工批准才会执行。锁文件同步 workflow 推送锁文件后触发的正是这种
# synchronize 事件，若合并方也依赖它，就会卡在待审批、无人批准 → 永不合并。
# 而 pull_request_target 在主分支上下文运行，「无论审批设置如何都会运行」。
#
# 为什么不再执行 `gh pr review --approve`
# ----------------------------------------
# 仓库未开启 "Allow GitHub Actions to create and approve pull requests"
# （can_approve_pull_request_reviews = false），审批请求会被 GitHub 拒绝：
#   GraphQL: GitHub Actions is not permitted to approve pull requests.
# 而分支保护本身 required_approving_review_count = 0（即并不要求人工审批），
# 所以这一步不仅多余，还是 auto-merge 失败的唯一原因（2026-10-21 实测）。
#
# 安全
# ----
# pull_request_target 有写权限且能读到 PR 的完整上下文，因此本 workflow
# 绝不 checkout 或执行 PR 分支里的任何代码：只用 GitHub API 读取元数据与
# check 状态，改动操作仅限 squash 合并。

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 判据用 PR 作者（pull_request.user）而非事件触发者（github.actor）：
    # 锁文件同步 workflow 推完锁文件后触发的 synchronize 事件，actor 是
    # github-actions[bot]；若按 actor 判断，合并方在锁文件就绪后反而不会被
    # 触发，PR 就永远停在待合并。PR 作者始终是 dependabot[bot]，判据稳定。
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: 获取 Dependabot 元数据
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: 审批并合并（仅 minor/patch）
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 无需在此判断锁文件是否已同步 —— CI 汇总本身就是最权威的判据：
          # 若锁文件未与依赖声明一致，CI 的 check_deps --strict 会红，
          # 「CI 汇总」就不会 success，合并自然不会发生。这同时消除了
          # 「同步与合并并行」的竞态：锁文件没同步完，CI 就不可能绿。
          #
          # 轮询分支保护真正要求的必填 check「CI 汇总」（= test + frontend 汇总）。
          # 必须按 head SHA 查 check-runs：锁文件推送后 head SHA 会变，旧 SHA 上
          # 的失败状态不再代表当前提交。
          for i in $(seq 1 80); do
            sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
            state=$(gh api "repos/$REPO/commits/$sha/check-runs" \
              --jq '[.check_runs[] | select(.name=="CI 汇总") | .conclusion] | unique | join(",")' \
              2>/dev/null || echo "UNKNOWN")
            echo "第 $i 次尝试：head=$sha CI 汇总=$state"
            if [ "$state" = "success" ]; then
              echo ">> CI 汇总通过，开始合并"
              gh pr merge --squash "$PR_NUMBER" --repo "$REPO"
              exit 0
            fi
            sleep 30
          done
          echo ">> 等待「CI 汇总」超时，不合并"
          exit 1
