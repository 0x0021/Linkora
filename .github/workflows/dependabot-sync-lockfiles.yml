name: Dependabot 依赖自动同步

# 解决「Dependabot 提了 PR，锁文件没跟着更新，CI 报依赖漂移，只能人工上机器
# 跑一遍 lock_deps.sh 再补一个提交」的问题。
#
# 本项目有四份依赖声明必须同版本：requirements.txt（真源）、pyproject.toml、
# requirements.lock（CI/Docker 实际安装）、uv.lock，CI 的 check_deps.py --strict
# 强制校验四者一致。但 Dependabot 只保证改声明文件，不保证锁文件同步
# （2026-10-14 的 #33、10-20 的 #34 都因此需人工补跑 lock_deps.sh）。
#
# 本 workflow 在 Dependabot PR 上自动重生成锁文件并推回分支；合并由
# dependabot-auto-merge.yml 负责（它用 pull_request_target 触发，必然运行）。
#
# 关键设计
# --------
# · 用 pull_request（不是 pull_request_target）触发：前者拿不到仓库 secrets，
#   天然避免在有写权限的上下文里执行 PR 里的代码。
# · 只执行主线（origin/base）的 lock_deps.sh / check_deps.py，不执行 PR 分支里
#   的同名脚本 —— 那是 Dependabot 可写的不可信输入。依赖声明文件取 PR 分支版本。
# · GITHUB_TOKEN 推送不会触发新的 workflow run（GitHub 防递归设计），故推完
#   锁文件后用 `gh workflow run ci.yml` 显式 dispatch 一次 CI，让新提交的锁文件
#   被 check_deps --strict 真正校验到。（需 actions: write 权限，否则 403。）
# · npm 侧不重生成锁文件：Dependabot 自身会正确更新 package-lock.json
#   （含 overrides 钉版），本地 npm 重算反因 npm 版本差异产生无谓漂移
#   （libc 字段、lock 内 name 字段随目录名变）。需重生成的只有 Python 侧两份锁。
# · 幂等：锁文件已一致则不提交、不 dispatch，无限循环风险已排除。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  # 按 PR 号 + head SHA 分组：锁文件推送会产生新 SHA，新 SHA 的 run 不得
  # 取消正在跑的第一个 run（否则锁文件推了一半就被打断）。
  group: dependabot-sync-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  sync-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只处理 Dependabot 开的 PR —— 普通 PR 的锁文件由作者自己负责，
    # 机器人擅自改动别人的分支是越权。
    # 判据用 PR 作者而非事件触发者：锁文件推送后的 synchronize 事件
    # actor 是 github-actions[bot]，但 PR 作者始终是 dependabot[bot]。
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@v7
        with:
          # 显式取 PR 的 head 分支：pull_request 事件默认检出的是 merge ref，
          # 直接 push merge ref 会被 GitHub 拒绝。
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: 检出主线可信脚本
        # 锁定执行主线版本的 lock_deps.sh / check_deps.py：PR 分支里的同名
        # 文件是 Dependabot 可写的不可信输入，不能拿它的代码来跑本仓库。
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/base" --quiet
          git show "origin/base:scripts/lock_deps.sh" > scripts/lock_deps.sh
          git show "origin/base:scripts/check_deps.py" > scripts/check_deps.py
          chmod +x scripts/lock_deps.sh
          echo "已用主线版本覆盖 lock_deps.sh / check_deps.py"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true

      - name: 判断是否涉及依赖文件
        id: relevant
        run: |
          changed=$(git diff --name-only "origin/base...HEAD")
          echo "变更文件："
          echo "$changed"
          echo "---"
          # 只要动了任一依赖相关文件就重生成 Python 锁文件：
          # Dependabot 的 npm 生态 PR 也会顺带更新 requirements.lock 里的传递
          # 依赖（如 setuptools），若不在此统一重生成，锁文件就会带着
          # 「非本仓库工具链产出」的漂移进主线。统一由 lock_deps.sh 产出，
          # 保证与本地/CI 的解析结果一致。
          if echo "$changed" | grep -qE '^(pyproject\.toml|requirements\.txt|requirements\.lock|uv\.lock)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "不涉及依赖相关文件，跳过锁文件重生成"
          fi

      - name: 重生成 Python 锁文件
        if: steps.relevant.outputs.relevant == 'true'
        # lock_deps.sh 用 uv pip compile 生成 requirements.lock、uv lock 生成
        # uv.lock，末尾自带 check_deps.py 校验。PY_FLOOR 与 CI 的 Python 版本
        # 同为 3.14，解析结果与 CI 一致。
        run: bash scripts/lock_deps.sh

      - name: 提交锁文件并推回 PR 分支
        id: push
        if: steps.relevant.outputs.relevant == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain requirements.lock uv.lock)" ]; then
            echo "锁文件已与依赖声明一致，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "锁文件有更新，提交："
          git status --porcelain requirements.lock uv.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock uv.lock
          git commit -m "chore(deps): 重新生成锁文件以匹配依赖声明"
          # GITHUB_TOKEN 推送：不会触发新的 workflow run（防递归），
          # 所以下面用 workflow_dispatch 显式重跑 CI。
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 CI 重跑
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # push 不会自动触发 CI（且该 push 改动了锁文件，pull_request 事件会因
        # 锁文件安全策略转为待审批），故用 workflow_dispatch 显式跑一次，
        # 让新提交的锁文件被 check_deps --strict 真正校验到。
        run: |
          git fetch origin "$HEAD_REF" --quiet
          gh workflow run ci.yml --ref "$HEAD_REF"
          echo "已 dispatch ci.yml on $HEAD_REF"
