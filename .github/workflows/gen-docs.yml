name: Linkora Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # actions/upload-artifact 需要创建 artifact
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate CHANGELOG
      run: |
        python scripts/gen_docs.py --all --since v0.4.4 > docs/CHANGELOG_PENDING.md

    - name: Generate test coverage report
      run: |
        python -m pytest tests/ --ignore=tests/test_account_isolation_integration.py --ignore=tests/test_account_identity.py --co -q > docs/TEST_COVERAGE.md

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: generated-docs
        path: |
          docs/CHANGELOG_PENDING.md
          docs/TEST_COVERAGE.md
