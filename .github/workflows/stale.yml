name: 过期标记

# 自动标记长期无活动的 Issue / PR，减轻维护负担。
# 仅打标、不打扰、不自动关闭 —— 保留协作弹性。

on:
  schedule:
    - cron: "30 1 * * *" # 每天 UTC 01:30
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 标记过期 Issue / PR
        uses: actions/stale@v11
        with:
          # Issue：60 天无活动打标，再 14 天无活动保持标记（不自动关）
          days-before-stale: 60
          days-before-close: -1
          stale-issue-message: >
            该 Issue 已 60 天无活动，标记为 stale。若有进展请补充信息，
            我们将保留它；如已解决可关闭。感谢理解。
          stale-issue-label: "stale"

          # PR：30 天无活动打标，再 14 天无活动保持标记（不自动关）
          days-before-pr-stale: 30
          days-before-pr-close: -1
          stale-pr-message: >
            该 PR 已 30 天无活动，标记为 stale。如需继续，请 rebase 并更新状态。
          stale-pr-label: "stale"

          #  exempt 标签永久不打标（如 pinned / 长期路线图）
          exempt-issue-labels: "pinned,roadmap,security,enhancement"
          exempt-pr-labels: "pinned,work-in-progress"

          # 有交互（comment / react / 指派）即视为活跃，移除 stale 标
          remove-stale-when-updated: true
          operations-per-run: 100
