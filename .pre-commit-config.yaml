# 密钥扫描门禁（F22）
# 任何含真实密钥的提交都会被本地 pre-commit 拦截，CI 也会再扫一遍。
# 安装：uv tool install pre-commit && pre-commit install
# 手动全量扫描：pre-commit run gitleaks --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        # 用 detect（protect 在 8.30+ 已废弃）。扫描整仓（含暂存区与历史），
        # 复用 .gitleaks.toml 的范围裁剪与 .gitleaksignore 基线。
        entry: gitleaks detect --config .gitleaks.toml --redact=100 --no-banner
        language: system
        pass_filenames: false
        # 与 CI 保持一致：失败即阻断提交
        fail_fast: true
