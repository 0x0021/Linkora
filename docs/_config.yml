# GitHub Pages 站点配置（部署源：仓库 main 分支 /docs 目录）
#
# 首页：docs/index.html —— 无 front matter 的独立静态页，Jekyll 原样拷贝，不套主题。
#       它同时承载落地页与文档索引，是文档入口的单一真源。
#       ⚠️ 不要再新增 docs/index.md：Jekyll 会把它渲染成同名 index.html 与静态首页抢路径。
#
# 其余 .md 文档：由 Jekyll 渲染为同名 .html（如 configuration.md → configuration.html）。
# skip_config_check: 关闭 GitHub Pages 严格配置校验（否则部署报 Page build failed）。
title: Linkora · 灵桥
description: 把 AI 分身接进钉钉、飞书和企业微信 —— 读得懂公司文档，会自己动手办事。
skip_config_check: true
exclude:
  - "*.mermaid"
  - "audit/**/*"
  - "refactor/**/*"
  - ".git"
  - "*.yaml"
  - "*.yml"
  # 以下为内部设计 / 审计 / 路线图文档，仅留仓库内供开发参考，不对外发布
  - "system_design.md"
  - "phase0_hardening_design.md"
  - "main_refactor_design.md"
  - "phase2_citation_confidence_design.md"
  - "tools_optimization_roadmap.md"
  - "cost_quality_dashboard_design.md"
  - "frontend_module_map.md"
  - "frontend-perf-audit.md"
  - "BINARY_PACKAGING_PLAN.md"
  - "archive/**/*"
destination: _site
