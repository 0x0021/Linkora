# GitHub Pages 站点配置（部署源：仓库 main 分支 /docs 目录）
#
# 首页：docs/index.html —— 无 front matter 的独立静态页，Jekyll 原样拷贝，不套主题。
#       它同时承载落地页与完整文档索引（26 篇），是文档入口的单一真源。
#       ⚠️ 不要再新增 docs/index.md：Jekyll 会把它渲染成同名 index.html 与静态首页抢
#       同一输出路径，静态文件优先，index.md 会静默失效（历史上已踩过一次）。
#
# 其余 .md 文档：由 Jekyll 渲染为同名 .html（如 configuration.md → configuration.html）。
#       注：原设计用 jekyll-theme-cayman，但 GitHub Pages 当前 Jekyll 构建该主题会失败
#       （见本小节 CHANGELOG），故暂不加 theme，.md 以默认样式渲染，保证站点可构建。
title: Linkora · 灵桥
description: 把 AI 分身接进钉钉、飞书和企业微信 —— 读得懂公司文档，会自己动手办事。

