<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="灵桥 Linkora">
  <defs>
    <linearGradient id="lk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- 桥墩（两岸） -->
  <rect x="7" y="30" width="3.4" height="12" rx="1.3" fill="url(#lk)"/>
  <rect x="37.6" y="30" width="3.4" height="12" rx="1.3" fill="url(#lk)"/>
  <!-- 桥面（连接两岸的通路） -->
  <rect x="6.5" y="31.4" width="35" height="2.6" rx="1.3" fill="url(#lk)"/>
  <!-- 主缆（悬索桥弧线 = 桥梁连接意象） -->
  <path d="M8.7 31 L24 9 L39.3 31" fill="none" stroke="url(#lk)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 吊索（智能节点向下连接桥面） -->
  <line x1="16" y1="20.5" x2="16" y2="31.4" stroke="url(#lk)" stroke-width="1.3" opacity="0.65"/>
  <line x1="24" y1="9" x2="24" y2="31.4" stroke="url(#lk)" stroke-width="1.3" opacity="0.65"/>
  <line x1="32" y1="20.5" x2="32" y2="31.4" stroke="url(#lk)" stroke-width="1.3" opacity="0.65"/>
  <!-- AI 智能节点（桥上的连接点 = 智能连接意象） -->
  <circle cx="16" cy="20.5" r="2.6" fill="url(#lk)"/>
  <circle cx="24" cy="9" r="3" fill="url(#lk)"/>
  <circle cx="32" cy="20.5" r="2.6" fill="url(#lk)"/>
</svg>
